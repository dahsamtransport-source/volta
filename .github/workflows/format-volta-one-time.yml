name: One-time VOLTA formatting on review branch
on:
  push:
    branches: [chore/quality-gates-20261114]
    paths:
      - .github/workflows/format-volta-one-time.yml
permissions:
  contents: write
jobs:
  format-legacy:
    if: github.repository == 'dahsamtransport-source/volta' && github.ref == 'refs/heads/chore/quality-gates-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Format only the two previously failing files
        run: bunx prettier --write src/components/data/VisitCapture.tsx src/routes/visits.tsx
      - name: Confirm whitespace patch and push to review branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add -- src/components/data/VisitCapture.tsx src/routes/visits.tsx
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style: normalize VOLTA visit screens to repository Prettier rules'
            git push origin 'HEAD:chore/quality-gates-20261114'
          else
            echo 'Files already formatted'
          fi
