name: Android debug APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-debug-apk.yml'

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already provides an Android SDK. Avoid the setup-android@v3
      # helper which currently asks sdkmanager for the removed legacy 'tools' package.
      - name: Install SDK 35 and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | head -n 1)"
          if [[ -z "$sdkmanager_bin" ]]; then
            echo '::error::Android SDK command line manager not present on runner.'
            exit 1
          fi
          "$sdkmanager_bin" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK signature, package and checksum
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          "$tools/aapt" dump badging "$apk" > "${RUNNER_TEMP}/volta-badging.txt"
          grep -F "package: name='com.muslly.volta'" "${RUNNER_TEMP}/volta-badging.txt"
          (cd android/app/build/outputs/apk/debug && sha256sum app-debug.apk > SHA256SUMS.txt)
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: volta-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
