name: Build signed VOLTA Android release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-release:
    # Only trusted main-branch code can receive production signing secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VOLTA_RELEASE_STORE_PASSWORD: ${{ secrets.VOLTA_RELEASE_STORE_PASSWORD }}
      VOLTA_RELEASE_KEY_ALIAS: ${{ secrets.VOLTA_RELEASE_KEY_ALIAS }}
      VOLTA_RELEASE_KEY_PASSWORD: ${{ secrets.VOLTA_RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Load encrypted release signing material
        shell: bash
        env:
          VOLTA_ANDROID_KEYSTORE_BASE64: ${{ secrets.VOLTA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in VOLTA_ANDROID_KEYSTORE_BASE64 VOLTA_RELEASE_STORE_PASSWORD VOLTA_RELEASE_KEY_ALIAS VOLTA_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$VOLTA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/volta-release.jks"
          test -s "$RUNNER_TEMP/volta-release.jks"
          echo "VOLTA_RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/volta-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: gradle -p android --no-daemon :app:assembleRelease

      - name: Verify APK signature and release metadata
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          signer="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)"
          test -n "$signer"
          "$signer" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/volta-signature-report.txt"
          cat "$RUNNER_TEMP/volta-signature-report.txt"
          if grep -Fqi 'Android Debug' "$RUNNER_TEMP/volta-signature-report.txt"; then
            echo '::error::Debug signing certificate detected in release build.'
            exit 1
          fi
          if ! grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$RUNNER_TEMP/volta-signature-report.txt"; then
            echo '::error::Required APK v2 signature verification failed.'
            exit 1
          fi
          (cd android/app/build/outputs/apk/release && sha256sum app-release.apk > SHA256SUMS.txt)

      - name: Upload verified signed APK for authorized testing
        uses: actions/upload-artifact@v4
        with:
          name: volta-android-signed-release-v0.2.0
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
