name: Build VOLTA Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - recovery/import-lovable-source
      - fix/volta-reliability-20261108
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches:
      - main
      - recovery/import-lovable-source
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install pinned Gradle 8.9
        shell: bash
        run: |
          set -euo pipefail
          version="8.9"
          archive="gradle-${version}-bin.zip"
          curl --fail --silent --show-error --location "https://services.gradle.org/distributions/${archive}" --output "${archive}"
          expected="$(curl --fail --silent --show-error --location "https://services.gradle.org/distributions/${archive}.sha256")"
          printf '%s  %s\n' "${expected}" "${archive}" | sha256sum --check
          unzip -q "${archive}" -d "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/gradle-${version}/bin" >> "${GITHUB_PATH}"

      - name: Verify Android toolchain
        run: |
          java -version
          gradle --version

      - name: Build debug APK
        run: gradle -p android --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: volta-android-debug-apk-v0.2.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
