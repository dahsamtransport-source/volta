<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f4a40">
    <title>VOLTA — غير متصل</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f5ef; color: #173c34; font-family: system-ui, sans-serif; text-align: center; }
      .box { max-width: 30rem; padding: 2rem; }
      h1 { font-size: 2rem; }
      p { line-height: 1.9; color: #52645f; }
      button { border: 0; border-radius: 12px; padding: .8rem 1.3rem; background: #1f4a40; color: white; font: inherit; }
    </style>
  </head>
  <body>
    <main class="box">
      <h1>VOLTA</h1>
      <h2>لا يوجد اتصال بالإنترنت</h2>
      <p>الصفحة الحالية لا تستطيع فتح بيانات النظام دون اتصال. العمليات التي سبق حفظها في الطابور المحلي لا تُحذف لمجرد انقطاع الشبكة.</p>
      <p>أعد الاتصال ثم اضغط «إعادة المحاولة». لا تمسح بيانات Safari أو بيانات التطبيق ولا تحذف التطبيق قبل اكتمال المزامنة.</p>
      <button type="button" onclick="location.reload()">إعادة المحاولة</button>
    </main>
  </body>
</html>
